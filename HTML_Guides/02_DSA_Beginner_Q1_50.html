            first = num
        elif num > second and num != first:

       code:`def find_missing(arr: list) -> int:

    expected_sum = n * (n + 1) // 2

    if len(arr) < 2:

       code:`def merge_sorted(arr1: list, arr2: list) -> list:
    result = []
    i = j = 0
    while i < len(arr1) and j < len(arr2):
        if arr1[i] <= arr2[j]:
            result.append(arr1[i]); i += 1
        else:
            result.append(arr2[j]); j += 1
    result.extend(arr1[i:])
    result.extend(arr2[j:])
    return result

    for i in range(len(arr)):

    count = 0
    for num in arr:

        seen.add(num)
    return count

       code:`def majority_element(arr: list) -> int:
    count = 0
    candidate = None
    for num in arr:
        if count == 0:
            candidate = num
        count += (1 if num == candidate else -1)
    return candidate

    if not arr:

        char_index[char] = i
        max_len = max(max_len, i - start + 1)

    seen = {}
    for i, num in enumerate(arr):
        complement = target - num
        if complement in seen:

# [2, 7, 11, 15], target=9 → [0, 1]`,time:"O(n)",space:"O(n)",pattern:"Hash Map"},
      {n:32,title:"Three Sum",diff:"Medium",tier:1,freq:"High",
       code:`def three_sum(arr: list, target: int = 0) -> list:
    arr.sort()
    result = []
    for i in range(len(arr) - 2):
        if i > 0 and arr[i] == arr[i-1]:
            continue
        left, right = i + 1, len(arr) - 1
        while left < right:
            total = arr[i] + arr[left] + arr[right]
            if total == 0:
                result.append([arr[i], arr[left], arr[right]])
                left += 1; right -= 1
            elif total < 0: left += 1
            else: right -= 1
    return result

// State
const STORE_KEY = 'dsa-p1-done';
let done = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let activeFilter = 'all';
let searchTerm = '';

function totalQ() { return sections.reduce((s,sec)=>s+sec.questions.length,0); }
function doneCount() { return Object.values(done).filter(Boolean).length; }
function qKey(sid, n) { return `${sid}::${n}`; }
function isDone(sid, n) { return !!done[qKey(sid,n)]; }

function toggleDone(sid, n) {
  const k = qKey(sid, n);
  done[k] = !done[k];
  localStorage.setItem(STORE_KEY, JSON.stringify(done));
  render(); renderSidebar(); updateStats();
}

function toggleOpen(cardEl) {
  cardEl.classList.toggle('open');
}

function updateStats() {
  const total = totalQ();
  const d = doneCount();
  document.getElementById('tot').textContent = total;
  document.getElementById('dn').textContent = d;
  document.getElementById('pct').textContent = Math.round(d/total*100)+'%';
  document.getElementById('fill').style.width = (d/total*100)+'%';
  document.getElementById('pt').textContent = `${d} / ${total}`;
}

function freqClass(f) {
  if(f==='Very High') return 'fh';
  if(f==='High') return 'fm';
  return 'fl';
}

function matches(q, sid) {
  if(activeFilter==='Easy'||activeFilter==='Medium'||activeFilter==='Hard') {
    if(q.diff !== activeFilter) return false;
  }
  if(activeFilter==='done' && !isDone(sid,q.n)) return false;
  if(activeFilter==='pending' && isDone(sid,q.n)) return false;
  if(searchTerm) {
    const s = searchTerm.toLowerCase();
    if(!q.title.toLowerCase().includes(s) && !q.pattern.toLowerCase().includes(s)) return false;
  }
  return true;
}

function renderSidebar() {
  const nav = document.getElementById('snav');
  nav.innerHTML = sections.map(sec => {
    const d = sec.questions.filter(q=>isDone(sec.id,q.n)).length;
    return `<a class="snav-item" href="#${sec.id}">${sec.emoji} ${sec.title}<span class="snav-badge">${d}/${sec.questions.length}</span></a>`;
  }).join('');
}

function render() {
  const content = document.getElementById('content');
  content.innerHTML = sections.map(sec => {
    const filtered = sec.questions.filter(q=>matches(q,sec.id));
    if(!filtered.length) return '';
    const d = sec.questions.filter(q=>isDone(sec.id,q.n)).length;
    return `
<div class="section" id="${sec.id}">
  <div class="sec-header" style="border-left-color:${sec.color}">
    <div>
      <h2>${sec.emoji} ${sec.title} <span style="color:var(--muted);font-weight:400;font-size:.9rem">${sec.range}</span></h2>
      <p>${sec.tip}</p>
    </div>
    <div class="sec-meta">
      <span style="font-size:.78rem;color:var(--muted)">${d}/${sec.questions.length} done</span>
    </div>
  </div>
  <div class="q-list">
    ${filtered.map(q => `
      <div class="q-card ${isDone(sec.id,q.n)?'done':''}" id="qc-${sec.id}-${q.n}">
        <div class="q-top" onclick="toggleOpen(document.getElementById('qc-${sec.id}-${q.n}'))">
          <div class="chk" onclick="event.stopPropagation();toggleDone('${sec.id}',${q.n})">
            <svg class="chk-svg" width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div class="q-title">Q${q.n}. ${q.title}</div>
            <div style="display:flex;gap:.4rem;margin-top:.3rem">
              <span class="freq-tag ${freqClass(q.freq)}">${q.freq} Freq</span>
              <span style="font-size:.68rem;color:var(--muted);background:var(--surface2);padding:.15rem .45rem;border-radius:10px">${q.pattern}</span>
            </div>
          </div>
          <div class="q-meta">
            <span class="diff ${q.diff}">${q.diff}</span>
            <span class="tier-badge t${q.tier}">T${q.tier}</span>
            <span style="color:var(--muted);font-size:.85rem">▼</span>
          </div>
        </div>
        <div class="q-expand">
          <pre>${q.code}</pre>
          <div class="complexity-row">
            <span><strong>Time:</strong> ${q.time}</span>
            <span><strong>Space:</strong> ${q.space}</span>
            <span><strong>Pattern:</strong> ${q.pattern}</span>
          </div>
        </div>
      </div>`).join('')}
  </div>
</div>`;
  }).join('');
}

document.getElementById('si').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  render();
});
document.querySelectorAll('.fb').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.f;
    render();
  });
});

renderSidebar(); render(); updateStats();
