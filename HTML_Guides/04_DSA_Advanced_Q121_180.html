    result = []
    def dfs(node):
        if not node: return

# Iterative version:

        if count[0] == k:

def right_side_view(root) -> list:
    if not root: return []
    result = []
    queue = deque([root])
    while queue:
        for i in range(len(queue)):
            node = queue.popleft()
            if i == len(queue):   # last in level
                result.append(node.val)
            if node.left: queue.append(node.left)

        left = height(node.left)
        right = height(node.right)

        return (left.val == right.val and

       code:`def build_tree(preorder: list, inorder: list):
    inorder_idx = {val: i for i, val in enumerate(inorder)}
    pre_idx = [0]

        node = TreeNode(root_val)

        node.left = dfs(left, idx - 1)

       code:`from collections import deque

def serialize(root) -> str:
    if not root: return "null"
    result = []
    queue = deque([root])
    while queue:
        node = queue.popleft()
        if node:
            result.append(str(node.val))
            queue.append(node.left)
            queue.append(node.right)
        else:
            result.append("null")
    return ",".join(result)

def deserialize(data: str):
    if data == "null": return None
    nodes = data.split(",")
    root = TreeNode(int(nodes[0]))
    queue = deque([root])
    i = 1
    while queue:
        node = queue.popleft()
        if nodes[i] != "null":
            node.left = TreeNode(int(nodes[i]))
            queue.append(node.left)
        i += 1
        if nodes[i] != "null":
            node.right = TreeNode(int(nodes[i]))
            queue.append(node.right)
        i += 1
    return root`},

def zigzag_level_order(root) -> list:
    if not root: return []
    result = []
    queue = deque([root])
    left_to_right = True
    while queue:
        level = []
        for _ in range(len(queue)):
            node = queue.popleft()
            level.append(node.val)
            if node.left: queue.append(node.left)
            if node.right: queue.append(node.right)
        result.append(level if left_to_right else level[::-1])
        left_to_right = not left_to_right
    return result`},

    def dfs(node):

        left_tail = dfs(node.left)
        right_tail = dfs(node.right)
        if node.left:
            left_tail.next = node.right
            node.right = node.left
            node.left = None
        return right_tail or left_tail or node
    dfs(root)`},

def path_sum_iii(root, target: int) -> int:
    prefix = defaultdict(int)
    prefix[0] = 1
    count = [0]
    def dfs(node, curr_sum):

        curr_sum += node.val
        count[0] += prefix[curr_sum - target]
        prefix[curr_sum] += 1
        dfs(node.left, curr_sum)
        dfs(node.right, curr_sum)
        prefix[curr_sum] -= 1
    dfs(root, 0)

    if not grid: return 0
    m, n = len(grid), len(grid[0])

    def dfs(i, j):

        grid[i][j] = '0'  # mark visited

def dijkstra(graph: dict, start: int) -> dict:

    dist[start] = 0
    heap = [(0, start)]  # (cost, node)
    while heap:

        if cost > dist[node]: continue

            if new_cost < dist[neighbor]:
                dist[neighbor] = new_cost
                heapq.heappush(heap, (new_cost, neighbor))

const STORE_KEY = 'dsa-p3-done';
let done = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let activeFilter = 'all', searchTerm = '';

function totalQ() { return sections.reduce((s,sec)=>s+sec.questions.length,0); }
function doneCount() { return Object.values(done).filter(Boolean).length; }
function qKey(sid,n) { return `${sid}::${n}`; }
function isDone(sid,n) { return !!done[qKey(sid,n)]; }
function toggleDone(sid,n) {
  const k=qKey(sid,n); done[k]=!done[k];
  localStorage.setItem(STORE_KEY,JSON.stringify(done));
  render(); renderSidebar(); updateStats();
}
function freqClass(f) { return f==='Very High'?'fh':f==='High'?'fm':'fl'; }
function matches(q,sid) {
  if(['Easy','Medium','Hard'].includes(activeFilter) && q.diff!==activeFilter) return false;
  if(activeFilter==='done' && !isDone(sid,q.n)) return false;
  if(activeFilter==='pending' && isDone(sid,q.n)) return false;
  if(searchTerm){const s=searchTerm.toLowerCase();if(!q.title.toLowerCase().includes(s)&&!q.pattern.toLowerCase().includes(s)) return false;}
  return true;
}
function updateStats() {
  const total=totalQ(), d=doneCount();
  document.getElementById('tot').textContent=total;
  document.getElementById('dn').textContent=d;
  document.getElementById('pct').textContent=Math.round(d/total*100)+'%';
  document.getElementById('fill').style.width=(d/total*100)+'%';
  document.getElementById('pt').textContent=`${d} / ${total}`;
}
function renderSidebar() {
  document.getElementById('snav').innerHTML=sections.map(sec=>{
    const d=sec.questions.filter(q=>isDone(sec.id,q.n)).length;
    return `<a class="snav-item" href="#${sec.id}">${sec.emoji} ${sec.title}<span class="snav-badge">${d}/${sec.questions.length}</span></a>`;
  }).join('');
}
function render() {
  document.getElementById('content').innerHTML=sections.map(sec=>{
    const filtered=sec.questions.filter(q=>matches(q,sec.id));
    if(!filtered.length) return '';
    const d=sec.questions.filter(q=>isDone(sec.id,q.n)).length;
    return `<div class="section" id="${sec.id}">
  <div class="sec-header" style="border-left-color:${sec.color}">
    <h2>${sec.emoji} ${sec.title} <span style="color:var(--muted);font-weight:400;font-size:.9rem">${sec.range}</span></h2>
    <p>${sec.tip} &nbsp;·&nbsp; ${d}/${sec.questions.length} done</p>
  </div>
  <div class="q-list">
    ${filtered.map(q=>`
    <div class="q-card ${isDone(sec.id,q.n)?'done':''}" id="qc3-${sec.id}-${q.n}">
      <div class="q-top" onclick="document.getElementById('qc3-${sec.id}-${q.n}').classList.toggle('open')">
        <div class="chk" onclick="event.stopPropagation();toggleDone('${sec.id}',${q.n})">
          <svg class="chk-svg" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="q-title">Q${q.n}. ${q.title}</div>
          <div style="display:flex;gap:.4rem;margin-top:.3rem">
            <span class="${freqClass(q.freq)}">${q.freq} Freq</span>
            <span class="pat-tag">${q.pattern}</span>
          </div>
        </div>
        <div class="q-meta">
          <span class="diff ${q.diff}">${q.diff}</span>
          <span class="tier-badge t${q.tier}">T${q.tier}</span>
          <span style="color:var(--muted)">▼</span>
        </div>
      </div>
      <div class="q-expand">
        <pre>${q.code}</pre>
        <div class="complexity-row">
          <span><strong>Time:</strong> ${q.time}</span>
          <span><strong>Space:</strong> ${q.space}</span>
          <span><strong>Pattern:</strong> ${q.pattern}</span>
        </div>
      </div>
    </div>`).join('')}
  </div>
</div>`;
  }).join('');
}
document.getElementById('si').addEventListener('input',e=>{searchTerm=e.target.value.trim();render();});
document.querySelectorAll('.fb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeFilter=btn.dataset.f; render();
  });
});
renderSidebar(); render(); updateStats();
</script>
</body>
</html>
