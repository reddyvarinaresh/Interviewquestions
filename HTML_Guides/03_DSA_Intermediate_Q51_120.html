    for i in range(n):

        for j in range(0, n - i - 1):

                arr[j], arr[j + 1] = arr[j + 1], arr[j]

        if not swapped:

def merge(left, right):

      {n:114,title:"Four Sum",diff:"Medium",tier:2,freq:"Medium",pattern:"Sort + Two Pointers",time:"O(n³)",space:"O(1)",
       code:`def four_sum(nums: list, target: int) -> list:
    nums.sort()
    result = []
    n = len(nums)
    for i in range(n - 3):
        if i > 0 and nums[i] == nums[i-1]: continue
        for j in range(i + 1, n - 2):
            if j > i + 1 and nums[j] == nums[j-1]: continue
            left, right = j + 1, n - 1
            while left < right:
                total = nums[i] + nums[j] + nums[left] + nums[right]
                if total == target:
                    result.append([nums[i], nums[j], nums[left], nums[right]])
                    while left < right and nums[left] == nums[left+1]: left += 1
                    while left < right and nums[right] == nums[right-1]: right -= 1
                    left += 1; right -= 1
                elif total < target: left += 1
                else: right -= 1
    return result`},
      {n:115,title:"Find All Anagrams in String",diff:"Medium",tier:1,freq:"High",pattern:"Fixed Sliding Window",time:"O(n)",space:"O(1)",
       code:`from collections import Counter

def find_anagrams(s: str, p: str) -> list:
    result = []
    p_count = Counter(p)
    window = Counter(s[:len(p)])
    if window == p_count: result.append(0)
    for i in range(len(p), len(s)):
        c_in = s[i]; c_out = s[i - len(p)]
        window[c_in] += 1
        window[c_out] -= 1
        if window[c_out] == 0: del window[c_out]
        if window == p_count: result.append(i - len(p) + 1)
    return result

# "cbaebabacd", "abc" → [0, 6]`},
      {n:116,title:"Longest Turbulent Subarray",diff:"Medium",tier:2,freq:"Medium",pattern:"Sliding Window",time:"O(n)",space:"O(1)",
       code:`def max_turbulence_size(arr: list) -> int:
    n = len(arr)
    if n < 2: return n
    left = max_len = 0
    for right in range(1, n):
        c = (arr[right] > arr[right-1]) - (arr[right] < arr[right-1])
        if c == 0: left = right
        elif right > 1:
            prev_c = (arr[right-1] > arr[right-2]) - (arr[right-1] < arr[right-2])
            if c == prev_c: left = right - 1
        max_len = max(max_len, right - left + 1)
    return max_len`},
      {n:117,title:"Number of Subarrays with Sum in Range",diff:"Medium",tier:2,freq:"Medium",pattern:"Prefix Sum",time:"O(n)",space:"O(n)",
       code:`def num_subarrays_with_sum(nums: list, goal: int) -> int:
    def at_most(k):
        if k < 0: return 0
        count = left = total = 0
        for right in range(len(nums)):
            total += nums[right]
            while total > k:
                total -= nums[left]; left += 1
            count += right - left + 1
        return count
    return at_most(goal) - at_most(goal - 1)`},

import time

class SlidingWindowRateLimiter:
    def __init__(self, max_requests: int, window_seconds: int):
        self.max_requests = max_requests
        self.window = window_seconds
        self.requests = deque()

    def is_allowed(self, user_id: str = "default") -> bool:
        now = time.time()
        # Remove expired requests
        while self.requests and self.requests[0] <= now - self.window:
            self.requests.popleft()
        if len(self.requests) < self.max_requests:
            self.requests.append(now)
            return True
        return False

# Used in FastAPI rate limiting — real-world DS/ML API pattern`},

       code:`def minimum_difference(nums: list, k: int) -> int:
    nums.sort()
    min_diff = float('inf')
    for i in range(len(nums) - k + 1):
        min_diff = min(min_diff, nums[i + k - 1] - nums[i])
    return min_diff`},

       code:`def max_satisfied(customers: list, grumpy: list, minutes: int) -> int:
    # Base satisfied customers
    base = sum(c for c, g in zip(customers, grumpy) if g == 0)
    # Extra customers gained in the window
    window_gain = sum(customers[i] * grumpy[i] for i in range(minutes))
    max_gain = window_gain
    for i in range(minutes, len(customers)):
        window_gain += customers[i] * grumpy[i]
        window_gain -= customers[i - minutes] * grumpy[i - minutes]
        max_gain = max(max_gain, window_gain)
    return base + max_gain`},

const STORE_KEY = 'dsa-p2-done';
let done = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let activeFilter = 'all', searchTerm = '';

function totalQ() { return sections.reduce((s,sec)=>s+sec.questions.length,0); }
function doneCount() { return Object.values(done).filter(Boolean).length; }
function qKey(sid,n) { return `${sid}::${n}`; }
function isDone(sid,n) { return !!done[qKey(sid,n)]; }
function toggleDone(sid,n) {
  const k = qKey(sid,n);
  done[k] = !done[k];
  localStorage.setItem(STORE_KEY, JSON.stringify(done));
  render(); renderSidebar(); updateStats();
}
function freqClass(f) {
  if(f==='Very High') return 'fh';
  if(f==='High') return 'fm';
  return 'fl';
}
function matches(q,sid) {
  if(activeFilter==='Easy'||activeFilter==='Medium'||activeFilter==='Hard') {
    if(q.diff!==activeFilter) return false;
  }
  if(activeFilter==='done' && !isDone(sid,q.n)) return false;
  if(activeFilter==='pending' && isDone(sid,q.n)) return false;
  if(searchTerm) {
    const s=searchTerm.toLowerCase();
    if(!q.title.toLowerCase().includes(s) && !q.pattern.toLowerCase().includes(s)) return false;
  }
  return true;
}
function updateStats() {
  const total=totalQ(), d=doneCount();
  document.getElementById('tot').textContent=total;
  document.getElementById('dn').textContent=d;
  document.getElementById('pct').textContent=Math.round(d/total*100)+'%';
  document.getElementById('fill').style.width=(d/total*100)+'%';
  document.getElementById('pt').textContent=`${d} / ${total}`;
}
function renderSidebar() {
  document.getElementById('snav').innerHTML=sections.map(sec=>{
    const d=sec.questions.filter(q=>isDone(sec.id,q.n)).length;
    return `<a class="snav-item" href="#${sec.id}">${sec.emoji} ${sec.title}<span class="snav-badge">${d}/${sec.questions.length}</span></a>`;
  }).join('');
}
function render() {
  document.getElementById('content').innerHTML=sections.map(sec=>{
    const filtered=sec.questions.filter(q=>matches(q,sec.id));
    if(!filtered.length) return '';
    const d=sec.questions.filter(q=>isDone(sec.id,q.n)).length;
    return `<div class="section" id="${sec.id}">
  <div class="sec-header" style="border-left-color:${sec.color}">
    <h2>${sec.emoji} ${sec.title} <span style="color:var(--muted);font-weight:400;font-size:.9rem">${sec.range}</span></h2>
    <p>${sec.tip} &nbsp;·&nbsp; ${d}/${sec.questions.length} done</p>
  </div>
  <div class="q-list">
    ${filtered.map(q=>`
    <div class="q-card ${isDone(sec.id,q.n)?'done':''}" id="qc2-${sec.id}-${q.n}">
      <div class="q-top" onclick="document.getElementById('qc2-${sec.id}-${q.n}').classList.toggle('open')">
        <div class="chk" onclick="event.stopPropagation();toggleDone('${sec.id}',${q.n})">
          <svg class="chk-svg" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="q-title">Q${q.n}. ${q.title}</div>
          <div style="display:flex;gap:.4rem;margin-top:.3rem">
            <span class="${freqClass(q.freq)}">${q.freq} Freq</span>
            <span class="pat-tag">${q.pattern}</span>
          </div>
        </div>
        <div class="q-meta">
          <span class="diff ${q.diff}">${q.diff}</span>
          <span class="tier-badge t${q.tier}">T${q.tier}</span>
          <span style="color:var(--muted)">▼</span>
        </div>
      </div>
      <div class="q-expand">
        <pre>${q.code}</pre>
        <div class="complexity-row">
          <span><strong>Time:</strong> ${q.time}</span>
          <span><strong>Space:</strong> ${q.space}</span>
          <span><strong>Pattern:</strong> ${q.pattern}</span>
        </div>
      </div>
    </div>`).join('')}
  </div>
</div>`;
  }).join('');
}
document.getElementById('si').addEventListener('input',e=>{searchTerm=e.target.value.trim();render();});
document.querySelectorAll('.fb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeFilter=btn.dataset.f; render();
  });
});
renderSidebar(); render(); updateStats();
</script>
</body>
